[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdata"
version = "0.6.3"
description = "Connector adapter: enterprise sources -> AgentTable -> TOON/TSV/JSON for LLM agents, plus setup, SQL guardrails, Jira changelog, PBIP tooling, UAT helpers and the DPM handoff contract"
requires-python = ">=3.12"
dependencies = [
    "rich>=13",     # the human-facing rendering; every command still works without it
    "keyring",      # every source's password path (ad-setup, ad-td, ad-ora, ...), not just the ones with a
                    # connector extra installed -- gating it behind an extra made `ad-setup` fail mid-wizard
                    # depending on which options a user picked, which is exactly the failure mode this avoids
    "pyodbc",       # same reasoning: `ad-setup` offers ODBC as a connection MODE for Teradata/Hive/Impala
                    # regardless of which extra was installed, so whether that choice worked depended on it too
]

[project.optional-dependencies]
teradata = ["teradatasql"]
oracle = ["oracledb"]
hive = ["impyla"]
impala = ["impyla"]
odbc = []           # no-op, same reason as keyring below: pyodbc is a base dependency now
keyring = []        # no-op: keyring is a base dependency now. Kept so an existing `pip install agentdata[keyring]`
                    # (this repo's own docs used to say to type it) still works instead of erroring on an unknown extra.
pbi = ["psutil"]
uat = ["openpyxl", "python-docx"]
pandas = ["pandas", "pyarrow"]
completion = ["argcomplete>=3.0.0"]
test = ["coverage>=7"]
dev = ["pytest", "pyyaml", "coverage>=7"]

[project.scripts]
ad-pncli = "agentdata.cli:main_pncli"
ad-td = "agentdata.cli:main_td"
ad-ora = "agentdata.cli:main_ora"
ad-hive = "agentdata.cli:main_hive"
ad-impala = "agentdata.cli:main_impala"
ad-diff = "agentdata.cli:main_diff"
ad-view = "agentdata.cli:main_view"
ad-setup = "agentdata.cli_setup:main_setup"
ad-doctor = "agentdata.cli_setup:main_doctor"
ad-sql-check = "agentdata.cli_sqlcheck:main"
ad-jira = "agentdata.cli_jira:main"
ad-pbip = "agentdata.cli_pbip:main"
ad-pbi = "agentdata.cli_pbi:main"
ad-uat = "agentdata.cli_uat:main"
ad-dpm = "agentdata.cli_dpm:main"
ad-state = "agentdata.cli_state:main"
ad-confluence = "agentdata.cli_confluence:main"
ad-update = "agentdata.update:main"
ad-help = "agentdata.cli_help:main"
ad-pbiviz = "agentdata.cli_pbiviz:main"
ad-graph = "agentdata.cli_graph:main"
ad-test = "agentdata.cli_test:main"
ad-argv = "agentdata.cli_argv:main"
ad-metrics = "agentdata.cli_metrics:main"

[tool.setuptools.packages.find]
include = ["agentdata*"]

[tool.setuptools.package-data]
# the project stub and external tool definitions must ship in the wheel: `ad-setup --project` runs on laptops with no repo checkout
agentdata = ["templates/project-stub/*", "templates/external-tool/*", "pbip/*.ps1"]

[tool.pytest.ini_options]
norecursedirs = ["tests/fixtures", "fixtures", ".*", "build", "dist"]
markers = [
    "slow: builds a wheel and a venv (deselect with -m 'not slow')",
    "laptop: the laptop verification suite; needs AGENTDATA_LAPTOP=1 and a real machine",
]
# an unregistered marker is a typo that silently selects nothing. No `-m` here: a second `-m` on
# the command line replaces it rather than combining, and the laptop suite gates itself on
# AGENTDATA_LAPTOP in tests/laptop/conftest.py.
addopts = "--strict-markers"
