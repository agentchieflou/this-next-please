[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdata"
version = "0.4.2"
description = "Connector adapter: enterprise sources -> AgentTable -> TOON/TSV/JSON for LLM agents, plus setup, SQL guardrails, Jira changelog, PBIP tooling, UAT helpers and the DPM handoff contract"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
teradata = ["teradatasql", "keyring"]
oracle = ["oracledb", "keyring"]
hive = ["impyla", "keyring"]
impala = ["impyla", "keyring"]
odbc = ["pyodbc"]
keyring = ["keyring"]
pbi = ["psutil"]
uat = ["openpyxl", "python-docx"]
pandas = ["pandas", "pyarrow"]
dev = ["pytest", "pyyaml"]

[project.scripts]
ad-pncli = "agentdata.cli:main_pncli"
ad-td = "agentdata.cli:main_td"
ad-ora = "agentdata.cli:main_ora"
ad-hive = "agentdata.cli:main_hive"
ad-impala = "agentdata.cli:main_impala"
ad-diff = "agentdata.cli:main_diff"
ad-view = "agentdata.cli:main_view"
ad-setup = "agentdata.cli_setup:main_setup"
ad-doctor = "agentdata.cli_setup:main_doctor"
ad-sql-check = "agentdata.cli_sqlcheck:main"
ad-jira = "agentdata.cli_jira:main"
ad-pbip = "agentdata.cli_pbip:main"
ad-uat = "agentdata.cli_uat:main"
ad-dpm = "agentdata.cli_dpm:main"
ad-state = "agentdata.cli_state:main"
ad-update = "agentdata.update:main"

[tool.setuptools.packages.find]
include = ["agentdata*"]

[tool.setuptools.package-data]
# the project stub must ship in the wheel: `ad-setup --project` runs on laptops with no repo checkout
agentdata = ["templates/project-stub/*"]

[tool.pytest.ini_options]
markers = ["slow: builds a wheel and a venv (deselect with -m 'not slow')"]
