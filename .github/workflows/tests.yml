# Every bug this repo has shipped was a Windows bug (path shims, BOM files, line endings), so Windows is not optional
# here. Windows is also not one shell: the laptop is PowerShell 7 and Git Bash, and people type commands into cmd, so
# each supported shell gets its own step and a failure names the shell it came from.
#
# Floors: Python 3.14 (pyproject requires-python, and the only Python tested; decision 23 on #429) and PowerShell 7. Windows PowerShell 5.1 is unsupported and appears
# exactly once below, in a step whose only job is to prove the refusal.
name: tests

on:
  push:
    branches: [main]
  # ready_for_review: a draft skips the Windows and IDE jobs below, so marking it ready has to run them.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # #309: a run on demand, so "N consecutive green runs" no longer needs N pushes. `nightly` (#595)
  # makes a dispatch a rehearsal of the nightly run: it adds the dated shuffle as well.
  workflow_dispatch:
    inputs:
      nightly:
        description: "also run the nightly job: the suite shuffled on today's date as the seed"
        type: boolean
        default: false
  # #595 (CI-3, D4): a full run every night at 03:17 UTC, plus `suite · shuffled · seed of the day`.
  schedule:
    - cron: "17 3 * * *"

# Decision 7 (the merge train, #429): a newer push to the same ref cancels the run it supersedes,
# so a train rebuilt without a red car does not queue behind the run that found it. #595: one group
# per event as well, so the nightly run and a merge push to main never cancel each other.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# #592: every `actions/setup-python` caches pip's downloads, keyed on pyproject.toml. The cache saves the
# download only; `pip install -e ".[dev]"` still runs, so a stale cache cannot change what is installed.
env:
  # The property tests run 200 examples per property here and 50 on a laptop, so a run is still a
  # few seconds locally while CI does the searching. `--hypothesis-seed` replays any failure.
  HYPOTHESIS_PROFILE: ci

jobs:
  # #593 (CI-1, decision 23 on #429): which groups of `.github/ci-paths.json` this change touches, from the
  # PR's diff or the push's range, and which jobs a path filter WOULD skip. Report only (D2): every job
  # below `needs:` it and none reads its outputs yet, so nothing is skipped; CI-4 (#596) adds the job-level
  # `if:`s. Filters gate whole jobs, never steps (#315's `holds()`), so no step anywhere tests these outputs.
  # A push, a dispatch and (CI-3) the nightly run output "all"; so does a path no group names.
  changes:
    name: changes · which groups a filter would run (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.map.outputs.all }}
      ci: ${{ steps.map.outputs.ci }}
      py: ${{ steps.map.outputs.py }}
      desk: ${{ steps.map.outputs.desk }}
      static-only: ${{ steps.map.outputs.static-only }}
      docs: ${{ steps.map.outputs.docs }}
      shells: ${{ steps.map.outputs.shells }}
      mobile: ${{ steps.map.outputs.mobile }}
      ide-vscode: ${{ steps.map.outputs.ide-vscode }}
      ide-jetbrains: ${{ steps.map.outputs.ide-jetbrains }}
      ide-desktop: ${{ steps.map.outputs.ide-desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Stdlib only, and it fails open: a broken map or a diff git cannot compute prints why and outputs
      # "all" rather than failing this job, which every other job needs.
      - name: map the changed paths to groups
        id: map
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: python .github/scripts/ci_paths.py .github/ci-paths.json

  # #595 (CI-3, plan §4.4): the tier that always runs, whatever a path filter skips (CI-4). A plain
  # install and the two commands every user types first, then the entry-point, refusal, onramp, PR-check
  # and hygiene tests on every core. About 2 minutes.
  smoke:
    name: smoke · install, doctor, entry points and hygiene
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10   # #309: its one step cap (5) plus 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      # The contract, not a clean bill of health: a runner has no pncli, so a row fails, and
      # check_doctor.py holds what that must look like (exit 1, TOON, a hint on every fail row).
      - name: ad-doctor
        run: |
          set +e
          out="$(ad-doctor --quiet 2>/dev/null)"
          rc=$?
          set -e
          printf '%s' "$out" | python .github/scripts/check_doctor.py --exit-code "$rc" --shell bash
      - run: python -m agentdata --help
      - run: pip install -e ".[dev]"
      # tests/test_hygiene_ci_ok.py holds this list to every tests/test_hygiene_*.py.
      - name: pytest · smoke
        timeout-minutes: 5
        run: >-
          python -m pytest -q -rs -n auto -m "not browser and not measured and not scale and not slow" --junitxml=junit/smoke.xml
          tests/test_entrypoints.py tests/test_refusals.py tests/test_agent_onramp.py tests/test_agent_pr_check.py
          tests/test_hygiene_checkout.py tests/test_hygiene_ci_budgets.py tests/test_hygiene_ci_cache.py tests/test_hygiene_ci_ok.py
          tests/test_hygiene_ci_paths.py tests/test_hygiene_flake_policy.py tests/test_hygiene_harness.py tests/test_hygiene_linux_shards.py
          tests/test_hygiene_orphans.py tests/test_hygiene_process_state.py tests/test_hygiene_shards.py
          tests/test_hygiene_tier_matrix.py tests/test_hygiene_windows_shards.py
      - name: durations · the per-step table
        if: always()
        run: |
          s=.github/scripts/durations.py
          if [ -f junit/smoke.xml ]; then
            python "$s" summarize junit/smoke.xml --step "pytest · smoke" --cap-minutes 5 | tee -a "$GITHUB_STEP_SUMMARY"
            python "$s" job junit/*.xml --job "smoke" --cap-minutes 10 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: durations · upload the junit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-smoke
          path: junit/
          retention-days: 14
          if-no-files-found: warn

  pytest:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    needs: changes
    runs-on: ${{ matrix.os }}
    # #309: the step caps below sum to 40, plus 5; a job with no cap of its own gets at most 20.
    # The ubuntu 3.14 leg's last green run took 16m40s (run 36035530921): its summary shows how
    # near that is.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # #312: require_browser marks the leg that installs Chromium. The browser tier itself runs
          # in its own jobs below (`ubuntu · python 3.14 · browser · shard K/2`), once per run; this
          # leg keeps the browser tests that are also measured or slow, the measurements and the demo.
          # #591: one leg. 3.14 is the floor (pyproject requires-python) and what the laptop runs.
          - {os: ubuntu-latest, python: "3.14", require_browser: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The dashboard is HTML that four embedders have to render, and the defects it has shipped
      # (a panel that could not be closed, a tile that could not be clicked) are invisible to any
      # test that reads the source instead of the page. Chromium is the engine under Edge,
      # PyCharm's JCEF and VS Code's Simple Browser, so one browser covers all three hosts.
      - name: a browser, so tests/test_fleet_desk*.py run instead of skipping
        run: python -m playwright install --with-deps chromium
      # #236: the desk's types, checked and never compiled. `tsc --noEmit` reads the JSDoc in
      # `common.js` and `app.js` against their code (`tsconfig.json`, `docs/desk-types.md`); nothing
      # is emitted, and the page is still the bytes in the repository. Its own step, so a type error
      # is named here rather than as one failed test somewhere in the suite, which runs the same
      # command (`tests/test_desk_types.py`). The runner's Node, the one the suite's `node --check`
      # uses; the compiler pinned exactly.
      - name: the desk's types (tsc --noEmit)
        run: npx --yes -p typescript@7.0.2 tsc -p tsconfig.json
      # Split up, because the parts want opposite things from the machine. The bulk is independent
      # work and takes every core there is; the `measured` tier asserts durations -- a 50ms paint
      # budget, a 4ms repaint, a fold under 0.05s -- and under `-n` it measures the contention
      # rather than the code. `scale` joins it because a 40,000-event fold sharing four cores with
      # three thousand other tests is the same mistake one layer up.
      #
      # The matrix used to carry a free-form `select` appended here. It is gone on purpose: a
      # second `-m` on a pytest command line REPLACES the first rather than combining with it,
      # so anyone filling that knob in would have silently switched the tier split off.
      #
      # #296: this leg installed Chromium above, so a browser test here may fail but never skip.
      # `AGENTDATA_REQUIRE_BROWSER` turns a skipped `browser` test into a failure (tests/conftest.py),
      # and `-rs` prints every remaining skip's reason, so a `no chromium` line cannot hide again.
      #
      # #312: the parallel step no longer runs the browser tier; the
      # `ubuntu · python 3.14 · browser · shard K/2` jobs do, once per run.
      #
      # #309: every pytest step writes a junit file and has its own cap, about 1.5x its last green
      # time rounded up to 5 (run 36035530921, the slower leg): the suite 12m10s, measured and scale
      # 2m12s, slow 1m20s, the measurements 46s, the demo 7s. The `always()` step at the end of the
      # job turns the junit files into the per-step tables in the job summary.
      # #312: step cap 10. Without the browser tier the selection is the inner loop's, which
      # tests/durations.json puts at about 6 minutes of test time on Linux, spread over every core.
      - name: the suite, in parallel
        timeout-minutes: 10
        env:
          AGENTDATA_REQUIRE_BROWSER: ${{ matrix.require_browser }}
        run: python -m pytest -q -rs -n auto -m "not browser and not slow and not measured and not scale" --junitxml=junit/pytest-parallel.xml
      # #312: the budgets are a property of the engine and the runner, not the Python version, so
      # the measured browser tests run here, on this leg only.
      - name: the measured and scale tiers, with the machine to themselves
        timeout-minutes: 5
        env:
          AGENTDATA_REQUIRE_BROWSER: ${{ matrix.require_browser }}
        run: python -m pytest -q -rs -m "(measured or scale) and not slow" --junitxml=junit/pytest-measured.xml
      # `slow` stays serial and stays here. It builds wheels in fresh venvs, and four concurrent
      # `pip install`s on a two-core runner is a different risk from the one this change is about;
      # it ran serially before and it runs serially now. #312: this leg keeps the one browser+slow
      # test (tests/test_fleet_demo_sitting.py).
      - name: the slow tier, serially
        timeout-minutes: 5
        env:
          AGENTDATA_REQUIRE_BROWSER: ${{ matrix.require_browser }}
        run: python -m pytest -q -rs -m slow --junitxml=junit/pytest-slow.xml

      # #220: the desk's own numbers, in the job output rather than in somebody's memory. These
      # tests already measure and assert; `-s` is what lets what they measured reach the log, and
      # the summary is where a reviewer looks without opening a run. One job only: the numbers are
      # a property of the engine and the runner, not of the Python version.
      - name: the desk's measurements, attached
        timeout-minutes: 5
        env:
          AGENTDATA_REQUIRE_BROWSER: "1"
        run: |
          set -o pipefail
          python -m pytest -q -rs -s -p no:cacheprovider --junitxml=junit/pytest-measurements.xml \
            tests/test_fleet_motion.py tests/test_fleet_trace.py \
            tests/test_fleet_instant.py tests/test_fleet_engines.py \
            2>&1 | tee desk-measurements.txt
          {
            echo '### The desk, measured'
            echo
            echo '```'
            grep -E 'frames during|ground repaint|local gestures|HeadlessChrome|^  [a-z@]' \
              desk-measurements.txt || echo 'no measurements printed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # And the demo itself, as the video and the frames it records. Kept for a fortnight, which
      # is long enough for a review and short enough not to be an archive.
      - name: the ownership demo, recorded
        timeout-minutes: 5
        env:
          AGENTDATA_SHOTS: ${{ github.workspace }}/demo-frames
          AGENTDATA_REQUIRE_BROWSER: "1"
        run: python -m pytest -q -rs -s -p no:cacheprovider tests/test_fleet_demo_ownership.py --junitxml=junit/pytest-demo.xml

      - name: upload the demo
        uses: actions/upload-artifact@v4
        with:
          name: ownership-demo
          path: |
            demo-frames/
            desk-measurements.txt
          retention-days: 14
          if-no-files-found: warn

      - name: the console scripts and the module form must both work
        run: |
          set -e
          ad-doctor --quiet || [ $? -eq 1 ]   # documented contract: 0 clean, 1 a row failed, nothing else
          python -m agentdata --help
          python -m agentdata update --check
      # Tab-completion is asserted by pressing Tab, not by reading the script: the previous version
      # passed its string checks while completing nothing at all.
      - name: completion · bash really completes
        run: |
          set -e
          eval "$(python -m agentdata setup --print-completion bash)"
          COMP_LINE="ad-pbip ch" COMP_POINT=10 _agentdata_complete
          [ "${COMPREPLY[*]}" = "check" ] || { echo "got: ${COMPREPLY[*]}"; exit 1; }
          COMP_LINE="ad-graph " COMP_POINT=9 _agentdata_complete
          case " ${COMPREPLY[*]} " in *" summary "*) ;; *) echo "got: ${COMPREPLY[*]}"; exit 1;; esac
          bash -n -c "$(python -m agentdata setup --print-completion bash)"
          if command -v zsh >/dev/null 2>&1; then
            zsh -n -c "$(python -m agentdata setup --print-completion zsh)"
          else
            echo "no zsh on this runner; the bash body it shares is linted above"
          fi

      - name: keep the reference output for the Windows byte-comparison
        run: |
          AGENTDATA_COLOR=never ad-doctor --quiet > doctor-linux.toon || [ $? -eq 1 ]
          python -m agentdata.toon --validate doctor-linux.toon
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-linux
          path: doctor-linux.toon

      # #309: what each pytest step cost, in the job summary, even when a step failed. A step over
      # 75% of its cap prints a warning; nothing here fails the build.
      - name: durations · the per-step table
        if: always()
        shell: bash
        env:
          JOB_NAME: ${{ matrix.os }} · python ${{ matrix.python }}
        run: |
          s=.github/scripts/durations.py
          report() { [ -f "junit/$1.xml" ] && python "$s" summarize "junit/$1.xml" --step "$2" --cap-minutes "$3" | tee -a "$GITHUB_STEP_SUMMARY"; true; }
          report pytest-parallel "the suite, in parallel" 10
          report pytest-measured "the measured and scale tiers" 5
          report pytest-slow "the slow tier, serially" 5
          report pytest-measurements "the desk's measurements" 5
          report pytest-demo "the ownership demo" 5
          if ls junit/*.xml >/dev/null 2>&1; then
            python "$s" job junit/*.xml --job "$JOB_NAME" --cap-minutes 20 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: durations · upload the junit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.python }}
          path: junit/
          retention-days: 14
          if-no-files-found: warn

  # #312: the browser tier, once per run, in two whole-file shards (tests/shard.py, #310, packed
  # by the `linux` times in tests/durations.json). Before this, both ubuntu legs paid for it inside
  # their parallel step although the page does not depend on the Python version. The browser tests
  # that are also `measured` or `slow` stay in the ubuntu leg above.
  browser:
    name: ubuntu · python 3.14 · browser · shard ${{ matrix.shard }}
    needs: changes
    runs-on: ubuntu-latest
    # #309's rule: at most 20; the step cap below plus 5.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: "1/2", key: "1"}
          - {shard: "2/2", key: "2"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: a browser, so the browser tier runs instead of skipping
        run: python -m playwright install --with-deps chromium
      # Under `-n 2`: the ubuntu legs ran this tier under `-n auto` for months (#227 is Windows-only),
      # and tests/durations.json puts the tier at about 25 minutes of test time, 12-13 per shard,
      # which a serial shard would spend on its own. Measured locally on 4 shared cores (#312's
      # handover): 9m44s and 11m32s under `-n 2`, against 14m35s and 16m37s serially. Step cap 15:
      # no green run of this job yet; the three runs criterion 1 asks for set it.
      - name: pytest · browser
        timeout-minutes: 15
        env:
          AGENTDATA_REQUIRE_BROWSER: "1"
        run: python -m pytest -q -rs -n 2 --shard=${{ matrix.shard }} -m "browser and not slow and not measured and not scale" --junitxml=junit/pytest-browser-${{ matrix.key }}.xml
      - name: durations · the per-step table
        if: always()
        shell: bash
        env:
          JOB_NAME: ubuntu · python 3.14 · browser · shard ${{ matrix.shard }}
          KEY: ${{ matrix.key }}
        run: |
          s=.github/scripts/durations.py
          report() { [ -f "junit/$1.xml" ] && python "$s" summarize "junit/$1.xml" --step "$2" --cap-minutes "$3" | tee -a "$GITHUB_STEP_SUMMARY"; true; }
          report pytest-browser-$KEY "pytest · browser" 15
          if ls junit/*.xml >/dev/null 2>&1; then
            python "$s" job junit/*.xml --job "$JOB_NAME" --cap-minutes 20 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # `junit-ubuntu-latest-*`, so docs/testing-this-repo.md's refresh of tests/durations.json
      # picks the tier up with the ubuntu leg's files.
      - name: durations · upload the junit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ubuntu-latest-3.14-browser-${{ matrix.key }}
          path: junit/
          retention-days: 14
          if-no-files-found: warn

  windows:
    name: windows · python ${{ matrix.python }} · ${{ matrix.part }}
    needs: changes
    runs-on: windows-latest
    # Decision 7 (the merge train, #429): the slowest job waits for a PR that is ready for review,
    # and always runs on a push to main. Builders' cars are tested locally; the train PR is not a draft.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # #311: shards of whole files, serial within a shard until #313. One serial 3.14 job outgrew
    # every cap it was given (15, 20, 25, 40 minutes; the pytest step alone took 28-32 minutes of
    # its 35 in runs 36258816693 and 36242056205), so the Windows leg is now four jobs in parallel:
    #   - three `--shard=K/3` jobs (tests/shard.py, #310): the old step's selection, each file
    #     whole in one shard, packed by the `windows` times in tests/durations.json, so a module
    #     still runs contiguously in one process as #227 needs;
    #   - packaging and shells: the measured and scale tiers with the machine to themselves, the
    #     slow tier (the lifecycle's real venvs; one browser+slow test), and every shell step.
    # #591: 3.14 only. The old floor's two shards were the only rows checked out with
    # core.autocrlf=true, so the three shards took that over and packaging and shells keeps false.
    # Every job's cap is 20 and each pytest step keeps its own. tests/test_hygiene_windows_shards.py
    # expands these rows the way Actions does and checks what each job runs; only a run shows how
    # long it takes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # require_browser (#296): a job that installs Chromium may not skip a browser test.
        # extras: which non-shard steps the row runs ("3.14": packaging and shells). key: the row's
        # junit file and artifact names. autocrlf: the shards check out the way Git for Windows
        # defaults (true, the setting behind train 13's line-ending bug); packaging and shells
        # leaves line endings alone (false), so the matrix still runs both ways.
        include:
          - {python: "3.14", autocrlf: "true", require_browser: "1", part: "shard 1/3", shard: "1/3", extras: "", key: "3.14-shard-1"}
          - {python: "3.14", autocrlf: "true", require_browser: "1", part: "shard 2/3", shard: "2/3", extras: "", key: "3.14-shard-2"}
          - {python: "3.14", autocrlf: "true", require_browser: "1", part: "shard 3/3", shard: "3/3", extras: "", key: "3.14-shard-3"}
          - {python: "3.14", autocrlf: "false", require_browser: "1", part: "packaging and shells", shard: "", extras: "3.14", key: "3.14-packaging"}
    steps:
      # A Windows checkout's line endings depend on core.autocrlf, and the fixtures' bytes are the
      # point of several tests. Run the matrix both ways rather than pinning one and hoping.
      - name: set core.autocrlf for this checkout
        shell: pwsh
        run: git config --global core.autocrlf ${{ matrix.autocrlf }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
        shell: pwsh

      # #146 asked for this harness on WINDOWS specifically: the dashboard's job is to render in
      # Edge, PyCharm's JCEF window and VS Code's Simple Browser on the operator's laptop, and all
      # three are Chromium. The job cap is why only one leg pays for the download.
      - name: a browser, so tests/test_fleet_desk*.py run instead of skipping
        if: matrix.require_browser == '1'
        shell: pwsh
        run: python -m playwright install chromium

      # the suite, one shard of whole files per job. Serial within a shard, and that is not an
      # oversight. Under `-n auto` this leg failed on three of four tries -- a DIFFERENT fleet test
      # each time, never the same one twice, never on Linux. That is concurrency-sensitivity the
      # suite had (process-level state in `serve`, reset by per-module autouse fixtures that
      # `--dist load` interleaves straight through), and it is #227; #313 revisits it.
      #
      # #311: step cap 15. The `windows` times in tests/durations.json put each shard at about
      # 9.3 minutes (the serial step's last runs: 28-32 minutes in run 36258816693).
      - name: pytest
        if: matrix.shard != ''
        shell: pwsh
        timeout-minutes: 15
        env:
          AGENTDATA_REQUIRE_BROWSER: ${{ matrix.require_browser }}
        run: python -m pytest -q -rs --shard=${{ matrix.shard }} -m "not slow and not measured and not scale" --junitxml=junit/windows-${{ matrix.key }}-pytest.xml
      # #435: late in the serial step Chromium has failed to fetch a script with
      # `net::ERR_NO_BUFFER_SPACE` (Winsock WSAENOBUFS), and the desk has logged WinError 10053.
      # #465's TIME_WAIT count read 4 on a green run and 2 on a red one (train 7): not the port range.
      # After the suite, pass or fail: the TIME_WAIT count and the dynamic port range as before, the
      # 10 PIDs that own the most TCP sockets with their image names, and how many chrome.exe and
      # node.exe are still alive (.github/scripts/sockets.py). Diagnostics only: never fails the job.
      - name: sockets after the suite (owners, live browsers, TIME_WAIT, dynamic ports)
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          python .github/scripts/sockets.py --top 10
          netsh int ipv4 show dynamicport tcp
          exit 0
      - name: the measured and scale tiers, with the machine to themselves
        if: matrix.extras == '3.14'
        shell: pwsh
        timeout-minutes: 5
        env:
          AGENTDATA_REQUIRE_BROWSER: ${{ matrix.require_browser }}
        run: python -m pytest -q -rs -m "(measured or scale) and not slow" --junitxml=junit/windows-${{ matrix.key }}-measured.xml

      # Split out, verbose, and with its own cap on purpose. A hang inside the slow marker used to
      # take the whole job down and `-q` never said which test it was in -- the log simply stopped
      # at a percentage. `-v` names each test as it starts, so the last line printed is the one.
      - name: pytest · slow
        if: matrix.extras == '3.14'
        shell: pwsh
        timeout-minutes: 10
        env:
          AGENTDATA_REQUIRE_BROWSER: ${{ matrix.require_browser }}
        run: python -m pytest -m slow -v -rs --durations=0 --capture=tee-sys --junitxml=junit/windows-${{ matrix.key }}-slow.xml

      # one step per shell, so a red job names the shell rather than "Windows"
      - name: smoke · pwsh 7
        if: matrix.extras != ''
        shell: pwsh
        run: .\.github\scripts\smoke.ps1

      - name: smoke · Git Bash
        if: matrix.extras != ''
        shell: bash
        run: bash .github/scripts/smoke.sh

      - name: smoke · cmd
        if: matrix.extras != ''
        shell: cmd
        run: .github\scripts\smoke.cmd

      # Tab-completion, per shell, driven the way a keypress drives it. Git Bash is the shell where
      # the old script was a guaranteed no-op: it needed `register-python-argcomplete` on PATH, and
      # that ships into the Scripts directory Windows does not add to PATH.
      - name: completion · Git Bash
        if: matrix.extras != ''
        shell: bash
        run: |
          set -e
          eval "$(python -m agentdata setup --print-completion bash)"
          COMP_LINE="ad-pbip ch" COMP_POINT=10 _agentdata_complete
          [ "${COMPREPLY[*]}" = "check" ] || { echo "got: ${COMPREPLY[*]}"; exit 1; }
          complete -p ad-graph | grep -q _agentdata_complete

      - name: completion · pwsh 7
        if: matrix.extras != ''
        shell: pwsh
        run: |
          Invoke-Expression (python -m agentdata setup --print-completion powershell | Out-String)
          $r = TabExpansion2 -inputScript 'ad-pbip ch' -cursorColumn 10
          $got = $r.CompletionMatches | ForEach-Object { $_.CompletionText }
          if ($got -notcontains 'check') { throw "pwsh completed to: $got" }
          $r = TabExpansion2 -inputScript 'ad-graph ' -cursorColumn 9
          $got = $r.CompletionMatches | ForEach-Object { $_.CompletionText }
          if ($got -notcontains 'summary') { throw "pwsh completed to: $got" }

      # The console code page is still 437/1252 on a US laptop even under pwsh 7, so the ASCII
      # fallback in ui.glyphs() has to keep working -- and 65001 has to keep the box drawing.
      - name: encoding · code page 437 falls back to ASCII
        if: matrix.extras != ''
        shell: cmd
        run: |
          chcp 437
          ad-doctor --quiet > cp437.toon 2>nul
          python -m agentdata.toon --validate cp437.toon
          python -c "import sys; t=open('cp437.toon',encoding='utf-8').read(); sys.exit(0 if '✓' not in t and '✗' not in t else 1)"

      - name: encoding · code page 65001 keeps the glyphs
        if: matrix.extras != ''
        shell: cmd
        run: |
          chcp 65001
          python -c "import sys; sys.stdout.reconfigure(encoding='utf-8'); print('→ · ≤')"

      # pwsh 7 writes UTF-8 without a BOM through >, Out-File and Set-Content. Proving it here is
      # what lets docs/setup.md drop the 5.1-era [IO.File]::WriteAllText guidance.
      - name: encoding · pwsh redirection is UTF-8 without a BOM, and byte-identical to Linux
        if: matrix.extras == '3.14'
        shell: pwsh
        run: |
          $env:AGENTDATA_COLOR = 'never'
          ad-doctor --quiet > doctor-win.toon 2>$null
          $bytes = [System.IO.File]::ReadAllBytes('doctor-win.toon')
          if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { throw 'pwsh wrote a UTF-8 BOM' }
          if ($bytes[0] -eq 0xFF -or $bytes[0] -eq 0xFE) { throw 'pwsh wrote UTF-16' }
          python -m agentdata.toon --validate doctor-win.toon

      # --- the floor guards. Both are red the moment a floor is loosened by accident. ---

      - name: floor · Windows PowerShell 5.1 is refused, and the doctor says why
        if: matrix.extras == '3.14'
        shell: powershell            # the ONLY 5.1 step in this workflow; it proves the refusal
        run: |
          # cmd.exe does the redirection: in 5.1 a native command's stderr piped through `2>&1`
          # becomes ErrorRecords, and GitHub sets $ErrorActionPreference='stop' for this shell, so
          # the step would die on the very refusal it exists to observe.
          $ErrorActionPreference = 'Continue'
          cmd /c "powershell -NoProfile -File .\.github\scripts\smoke.ps1 > refusal.txt 2>&1"
          $rc = $LASTEXITCODE
          $out = Get-Content refusal.txt -Raw
          Write-Host $out
          if ($rc -eq 0) { throw 'smoke.ps1 ran under Windows PowerShell 5.1; #Requires -Version 7.0 is not doing its job' }
          if ($out -notmatch '7\.0') { throw "the refusal did not mention the required version" }
          Write-Host 'refused as expected'
          # called straight from PowerShell, deliberately: the shell row reports the *immediate*
          # parent, so wrapping this in `cmd /c` would correctly report cmd and prove nothing
          ad-doctor --quiet > doctor51.toon 2>$null
          $doc = Get-Content doctor51.toon -Raw
          Write-Host $doc
          if ($doc -notmatch 'PowerShell 7 required') { throw 'ad-doctor did not warn about 5.1' }
          Write-Host 'ad-doctor warned about the unsupported shell'
          # Unsupported for running ad-* is not the same as broken for completing it. The emitted
          # script is 5.1 syntax on purpose, so somebody on a locked-down laptop still gets Tab.
          Invoke-Expression (python -m agentdata setup --print-completion powershell | Out-String)
          $r = TabExpansion2 -inputScript 'ad-pbip ch' -cursorColumn 10
          $got = $r.CompletionMatches | ForEach-Object { $_.CompletionText }
          if ($got -notcontains 'check') { throw "5.1 completed to: $got" }
          Write-Host 'tab-completion works under Windows PowerShell 5.1'
          # ad-doctor legitimately exits 1 on a bare runner (no pncli), and GitHub appends
          # `exit $LASTEXITCODE` to this shell -- so the step would inherit the exit code of a
          # command whose failure is not what it is asserting. Every assertion above throws.
          exit 0

      # #309: the per-step table, as on the ubuntu legs.
      - name: durations · the per-step table
        if: always()
        shell: bash
        env:
          JOB_NAME: windows · python ${{ matrix.python }} · ${{ matrix.part }}
          KEY: ${{ matrix.key }}
        run: |
          s=.github/scripts/durations.py
          report() { [ -f "junit/$1.xml" ] && python "$s" summarize "junit/$1.xml" --step "$2" --cap-minutes "$3" | tee -a "$GITHUB_STEP_SUMMARY"; true; }
          report windows-$KEY-pytest "pytest" 15
          report windows-$KEY-measured "the measured and scale tiers" 5
          report windows-$KEY-slow "pytest · slow" 10
          if ls junit/*.xml >/dev/null 2>&1; then
            python "$s" job junit/*.xml --job "$JOB_NAME" --cap-minutes 20 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: durations · upload the junit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-windows-${{ matrix.key }}
          path: junit/
          retention-days: 14
          if-no-files-found: warn

  floor-python:
    name: floor · pip refuses the wheel on Python 3.13
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: build the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist_floor
      - name: the wheel's metadata must declare the floor
        run: |
          python - <<'PY'
          import glob, re, zipfile
          wheel = glob.glob("dist_floor/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              meta = next(n for n in z.namelist() if n.endswith("METADATA"))
              text = z.read(meta).decode("utf-8")
          m = re.search(r"(?m)^Requires-Python: (.+)$", text)
          assert m, "the wheel declares no Requires-Python"
          print("Requires-Python:", m.group(1))
          assert ">=3.14" in m.group(1), f"the floor moved without anyone saying so: {m.group(1)}"
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: pip on 3.13 must refuse it, in those words
        run: |
          set +e
          out=$(python3.13 -m pip install dist_floor/*.whl 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "pip installed a >=3.14 wheel on 3.13"; exit 1; fi
          echo "$out" | grep -q "requires a different Python" || {
            echo "pip refused, but not with the message the docs promise the user will see"; exit 1; }
          echo "$out" | grep -qF "not in '>=3.14'" || {
            echo "pip refused, but not because of the 3.14 floor"; exit 1; }
          echo "refused as documented"

  lint-shell-scripts:
    name: lint · shellcheck + PSScriptAnalyzer
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The completion scripts are generated, not committed, so they are written out here and linted
      # with everything else -- a script nobody lints is a script that regresses.
      - name: write the generated shell scripts out for the linters
        run: |
          mkdir -p generated
          python -m agentdata setup --print-completion bash > generated/completion.sh
          python -m agentdata setup --print-completion powershell > generated/completion.ps1
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=bash .github/scripts/smoke.sh
          shellcheck --shell=bash generated/completion.sh
      - name: PSScriptAnalyzer, targeting the PowerShell 7 floor
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = Invoke-ScriptAnalyzer -Path .github/scripts/smoke.ps1 -Settings PSGallery `
              -IncludeRule PSUseCompatibleSyntax -Severity Error, Warning
          $compat = Invoke-ScriptAnalyzer -Path .github/scripts/smoke.ps1 `
              -IncludeRule PSUseCompatibleSyntax `
              -Settings @{ Rules = @{ PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('7.0') } } }
          $all = @($results) + @($compat) | Where-Object { $_ }
          if ($all) { $all | Format-Table -AutoSize | Out-String | Write-Host; throw "$($all.Count) analyzer finding(s)" }
          Write-Host 'PSScriptAnalyzer clean'
      # The completion script targets BOTH floors: 5.1 as well, because it is the one thing that
      # still has to work in a shell the commands themselves do not support.
      - name: PSScriptAnalyzer on the generated completer, 5.1 and 7.0
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path generated/completion.ps1 `
              -Settings @{ Rules = @{ PSUseCompatibleSyntax = @{
                  Enable = $true; TargetVersions = @('5.1', '7.0') } } }
          $style = Invoke-ScriptAnalyzer -Path generated/completion.ps1 -Severity Error, Warning
          $all = @($findings) + @($style) | Where-Object { $_ }
          if ($all) { $all | Format-Table -AutoSize | Out-String | Write-Host; throw "$($all.Count) analyzer finding(s)" }
          Write-Host 'the generated completer is clean on 5.1 and 7.0'

  floor-lints:
    name: lint · bash 4.4 and pwsh 7 floors
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10   # #309: its one step cap (5) plus 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # CI's bash is 5.x and its pwsh *is* the floor, so what CI can guard is the feature set:
      # nothing after bash 4.4 in anything we ship or emit, and a declared floor in every .ps1.
      - run: python -m pytest -q tests/test_bash_floor.py --junitxml=junit/floor-lints.xml
        timeout-minutes: 5   # #309: 1 s in run 36035530921
      - name: the laptop suite must never run here
        run: |
          set -e
          python -m pytest -q --collect-only -m laptop | tee collected.txt
          grep -q "no tests ran\|0 tests collected\|deselected" collected.txt || \
            { echo "the laptop suite was collected on CI"; exit 1; }
      - name: durations · the per-step table
        if: always()
        run: |
          if [ -f junit/floor-lints.xml ]; then
            python .github/scripts/durations.py summarize junit/floor-lints.xml \
              --step "tests/test_bash_floor.py" --cap-minutes 5 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: durations · upload the junit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-floor-lints
          path: junit/
          retention-days: 14
          if-no-files-found: warn

  coverage:
    name: coverage · per-module floors
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20   # #309: its one step cap (15) plus 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # #312: no browser is installed here, so the browser tier is deselected rather than left to skip.
      - name: run the suite under coverage
        timeout-minutes: 15   # #309: 9m38s in run 36035530921
        run: |
          python -m coverage run -m pytest -q -ra --durations=10 -m "not browser" --junitxml=junit/coverage.xml
          python -m coverage json -o coverage.json
          python -m coverage report --skip-covered | tail -20
      # No repo-wide number: a single percentage invites padding and says nothing about the modules
      # that actually break on Windows. Floors are per module and ratchet up only.
      - run: python .github/scripts/coverage_floors.py --coverage-json coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.json
      - name: durations · the per-step table
        if: always()
        run: |
          if [ -f junit/coverage.xml ]; then
            python .github/scripts/durations.py summarize junit/coverage.xml \
              --step "run the suite under coverage" --cap-minutes 15 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: durations · upload the junit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-coverage
          path: junit/
          retention-days: 14
          if-no-files-found: warn

  # #312: one job per seed, so the two orders run side by side rather than one after the other
  # (6m51s + 6m33s of steps in run 35907338054, over the 12-minute bound). Each seed still runs the
  # whole non-browser suite, serially: under `-n` the order would be the scheduler's, not the seed's.
  order-independence:
    name: suite · shuffled · seed ${{ matrix.seed }}
    needs: changes
    runs-on: ubuntu-latest
    # #309: the step cap plus 5.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: ["1", "20260904"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # A fixture that leaks state shows up here rather than three months later as
      # "works on my machine". Two seeds, because one shuffle proves very little.
      # #309: 7m38s and 7m14s in run 36035530921. No browser is installed here, so the tier is
      # deselected rather than left to skip; the `suite · shuffled · browser` jobs shuffle it.
      - name: pytest · shuffled
        timeout-minutes: 15
        run: python -m pytest -q -p no:cacheprovider -m "not browser" --shuffle-seed ${{ matrix.seed }} --junitxml=junit/shuffled-${{ matrix.seed }}.xml
      - name: durations · the per-step table
        if: always()
        env:
          SEED: ${{ matrix.seed }}
        run: |
          s=.github/scripts/durations.py
          if [ -f "junit/shuffled-$SEED.xml" ]; then
            python "$s" summarize "junit/shuffled-$SEED.xml" --step "shuffled, seed $SEED" \
              --cap-minutes 15 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if ls junit/*.xml >/dev/null 2>&1; then
            python "$s" job junit/*.xml --job "suite · shuffled · seed $SEED" --cap-minutes 20 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: durations · upload the junit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shuffled-${{ matrix.seed }}
          path: junit/
          retention-days: 14
          if-no-files-found: warn

  # #312: the browser tier holds the most process-global state in the suite (a server, a browser,
  # the page's own timers), and until now it had never run in a shuffled order: `suite · shuffled`
  # installed no browser and every browser test skipped there. That is where #227 lives. Two
  # whole-file shards, each serial on purpose (see above), on seed 1.
  order-independence-browser:
    name: suite · shuffled · browser · shard ${{ matrix.shard }}
    needs: changes
    runs-on: ubuntu-latest
    # #309's rule: at most 20; the step cap below plus 5.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: "1/2", key: "1"}
          - {shard: "2/2", key: "2"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: a browser, so the browser tier runs instead of skipping
        run: python -m playwright install --with-deps chromium
      # Step cap 15: no green run of this job yet.
      - name: pytest · shuffled · browser
        timeout-minutes: 15
        env:
          AGENTDATA_REQUIRE_BROWSER: "1"
        run: python -m pytest -q -p no:cacheprovider -rs --shard=${{ matrix.shard }} --shuffle-seed 1 -m "browser and not slow and not measured and not scale" --junitxml=junit/shuffled-browser-${{ matrix.key }}.xml
      - name: durations · the per-step table
        if: always()
        shell: bash
        env:
          JOB_NAME: suite · shuffled · browser · shard ${{ matrix.shard }}
          KEY: ${{ matrix.key }}
        run: |
          s=.github/scripts/durations.py
          report() { [ -f "junit/$1.xml" ] && python "$s" summarize "junit/$1.xml" --step "$2" --cap-minutes "$3" | tee -a "$GITHUB_STEP_SUMMARY"; true; }
          report shuffled-browser-$KEY "pytest · shuffled · browser" 15
          if ls junit/*.xml >/dev/null 2>&1; then
            python "$s" job junit/*.xml --job "$JOB_NAME" --cap-minutes 20 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: durations · upload the junit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shuffled-browser-${{ matrix.key }}
          path: junit/
          retention-days: 14
          if-no-files-found: warn

  # #595 (CI-3, D4): the nightly run's own job. One more order, seeded with the date (UTC), so each night
  # tries a new one and a red one names the seed that replays it. Nightly only: a dispatch with
  # `nightly` rehearses it; a push, a PR and a plain dispatch skip it, and ci-ok takes a skip as a pass.
  order-independence-nightly:
    name: suite · shuffled · seed of the day
    needs: changes
    if: github.event_name == 'schedule' || inputs.nightly == true
    runs-on: ubuntu-latest
    # #309: the step cap plus 5, as `suite · shuffled · seed N`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: the seed of the day
        id: seed
        run: echo "seed=$(date -u +%Y%m%d)" | tee -a "$GITHUB_OUTPUT"
      - name: pytest · shuffled
        timeout-minutes: 15
        run: python -m pytest -q -p no:cacheprovider -m "not browser" --shuffle-seed ${{ steps.seed.outputs.seed }} --junitxml=junit/shuffled-nightly.xml
      - name: durations · the per-step table
        if: always()
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          s=.github/scripts/durations.py
          if [ -f junit/shuffled-nightly.xml ]; then
            python "$s" summarize junit/shuffled-nightly.xml --step "shuffled, seed $SEED (the date)" \
              --cap-minutes 15 | tee -a "$GITHUB_STEP_SUMMARY"
            python "$s" job junit/*.xml --job "suite · shuffled · seed of the day" --cap-minutes 20 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: durations · upload the junit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shuffled-nightly
          path: junit/
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------- the IDE shells (#100)
  #
  # Separate jobs, because a Gradle IntelliJ build downloads an IDE and neither shell can break
  # the Python suite. They are the only verification these two artefacts get: nobody can compile
  # Kotlin or package a .vsix on the laptop this was written on.

  vscode-extension:
    name: ide · vscode extension
    needs: changes
    runs-on: ubuntu-latest
    # #592: a draft PR skips the IDE builds, as it skips Windows; marking it ready (`ready_for_review`
    # above) runs them, and a push to main or a dispatch always does.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        run: npm install --no-audit --no-fund
        working-directory: ide/vscode
      # `--strict` is on in tsconfig, so this is a real check and not a formality: the extension
      # talks to the fleet over HTTP and every field it reads is typed here.
      - name: typecheck and compile
        run: npm run compile
        working-directory: ide/vscode
      - name: package
        run: npx --yes @vscode/vsce@3 package --no-dependencies -o agentdata-fleet.vsix
        working-directory: ide/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: agentdata-fleet-vsix
          path: ide/vscode/agentdata-fleet.vsix

  jetbrains-plugin:
    name: ide · jetbrains plugin
    needs: changes
    runs-on: ${{ matrix.os }}
    # #592: not on a draft PR, as above.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        # Windows too: the IntelliJ Gradle plugin is where path bugs live, and Windows is the only
        # platform this fleet is actually operated from.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # No committed `gradle-wrapper.jar`: a binary in the repository is a thing nobody reviews.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: build the plugin
        run: gradle buildPlugin --no-daemon --stacktrace
        working-directory: ide/jetbrains
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: agentdata-fleet-plugin
          path: ide/jetbrains/build/distributions/*.zip

  # #595 (CI-3, plan §4.4): the one check a protection rule or a READY post names (D5). It needs every
  # job above and runs whatever they did; a job that failed or was cancelled fails it, and a job that
  # was skipped (a draft's Windows and IDE jobs, the nightly job by day, CI-4's filters) does not.
  # tests/test_hygiene_ci_ok.py pins `needs:` to every other job, so a new job cannot be left out of it.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - smoke
      - pytest
      - browser
      - windows
      - floor-python
      - lint-shell-scripts
      - floor-lints
      - coverage
      - order-independence
      - order-independence-browser
      - order-independence-nightly
      - vscode-extension
      - jetbrains-plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_ok.py
